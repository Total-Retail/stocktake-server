name: Deploy to Spar Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: SSH Deploy (WSL2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testing

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Install OpenVPN ───────────────────────────────────────────────────
      - name: Install OpenVPN
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openvpn

      # ── 3. Connect VPN ───────────────────────────────────────────────────────
      - name: Connect OpenVPN
        run: |
          mkdir -p .github/vpn

          cat > .github/vpn/spar.ovpn << 'OVPNEOF'
          ${{ secrets.OVPN_CONFIG }}
          OVPNEOF

          sed -i 's/^          //' .github/vpn/spar.ovpn
          sed -i '/^verify-x509-name/d' .github/vpn/spar.ovpn
          sed -i '/^;/d' .github/vpn/spar.ovpn
          sed -i '/^auth-user-pass/d' .github/vpn/spar.ovpn

          printf '%s\n%s\n' '${{ secrets.VPN_USERNAME }}' '${{ secrets.VPN_PASSWORD }}' | \
            sudo openvpn \
              --config .github/vpn/spar.ovpn \
              --auth-user-pass /dev/stdin \
              --verb 3 &

          echo "Waiting for VPN tunnel..."
          for i in $(seq 1 30); do
            if ip addr show tun0 > /dev/null 2>&1; then
              echo "VPN tunnel is up (attempt $i)"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "VPN failed to establish tunnel"
              exit 1
            fi
            echo "Attempt $i - waiting..."
            sleep 2
          done

      # ── 4. Configure SSH ─────────────────────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ vars.SSH_PORT }} -H ${{ vars.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # ── 5. Write .env into WSL ───────────────────────────────────────────────
      - name: Write .env to WSL
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          LS_BASE_URL: ${{ vars.LS_BASE_URL }}
          LS_USERNAME: ${{ vars.LS_USERNAME }}
          LS_PASSWORD: ${{ secrets.LS_PASSWORD }}
          LS_COMPANY_ID: ${{ vars.LS_COMPANY_ID }}
          PUBLIC_WS_URL: ${{ vars.PUBLIC_WS_URL }}
        run: |
          printf "DB_PASSWORD=%s\n" "$DB_PASSWORD"             > deployment.env
          printf "REDIS_PASSWORD=%s\n" "$REDIS_PASSWORD"      >> deployment.env
          printf "JWT_SECRET=%s\n" "$JWT_SECRET"              >> deployment.env
          printf "OTP_SECRET=%s\n" "$OTP_SECRET"              >> deployment.env
          printf "SMS_API_KEY=%s\n" "$SMS_API_KEY"            >> deployment.env
          printf "SMS_BASE_URL=https://sms.localhost.co.zw/api\n" >> deployment.env
          printf "LS_BASE_URL=%s\n" "$LS_BASE_URL"            >> deployment.env
          printf "LS_USERNAME=%s\n" "$LS_USERNAME"            >> deployment.env
          printf "LS_PASSWORD=%s\n" "$LS_PASSWORD"            >> deployment.env
          printf "LS_COMPANY_ID=%s\n" "$LS_COMPANY_ID"        >> deployment.env
          printf "PUBLIC_WS_URL=%s\n" "$PUBLIC_WS_URL"        >> deployment.env
          printf "OTP_EXPIRY_MINUTES=10\n"                    >> deployment.env
          printf "OTP_MAX_REQUESTS=3\n"                       >> deployment.env
          printf "COUNTER_TOKEN_HOURS=12\n"                   >> deployment.env
          printf "ADMIN_TOKEN_HOURS=8\n"                      >> deployment.env
          printf "VARIANCE_TOLERANCE_PCT=2.0\n"               >> deployment.env

          scp -i ~/.ssh/deploy_key -P ${{ vars.SSH_PORT }} \
              deployment.env ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:C:/stocktake-staging-env

          ssh -i ~/.ssh/deploy_key -p ${{ vars.SSH_PORT }} \
              ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} \
              "wsl -d Ubuntu -- cp /mnt/c/stocktake-staging-env /home/stocktake/app/.env"

      # ── 6. Sync code ─────────────────────────────────────────────────────────
      - name: Sync code to server
        run: |
          tar -czf /tmp/stocktake.tar.gz \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=.env \
            --exclude=.next \
            .

          scp -i ~/.ssh/deploy_key -P ${{ vars.SSH_PORT }} \
              /tmp/stocktake.tar.gz ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:C:/stocktake-staging.tar.gz

          ssh -i ~/.ssh/deploy_key -p ${{ vars.SSH_PORT }} \
              ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} \
              "wsl -d Ubuntu -- tar -xzf /mnt/c/stocktake-staging.tar.gz -C /home/stocktake/app"

      # ── 7. Build, start, and wait for healthy ────────────────────────────────
      - name: Deploy containers
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ vars.SSH_PORT }} \
              ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} \
              "wsl -d Ubuntu -- bash" << 'WSLEOF'
          set -e
          cd /home/stocktake/app
          echo "→ Pulling latest images..."
          docker compose pull --ignore-pull-failures
          echo "→ Building and starting services..."
          docker compose up --build -d --remove-orphans
          echo "→ Waiting for API to become healthy..."
          timeout 120 bash -c 'until docker inspect --format="{{.State.Health.Status}}" stocktake-api | grep -q "healthy"; do sleep 3; echo "  waiting..."; done'
          echo "→ Cleaning up old images..."
          docker image prune -f
          echo "✓ Deployment complete"
          WSLEOF

      # ── 8. Verify stack responding through nginx ──────────────────────────────
      - name: Verify stack is responding
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ vars.SSH_PORT }} \
              ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} \
              "wsl -d Ubuntu -- bash" << 'WSLEOF'
          curl -sf http://localhost:8084/health && echo "API-OK"
          HTTP_CODE=$(curl -sf -o /dev/null -w '%{http_code}' http://localhost:8084/)
          echo "Web returned: $HTTP_CODE"
          echo "$HTTP_CODE" | grep -qE '^(200|304)' && echo "WEB-OK"
          WSLEOF

      # ── 10. Cleanup ──────────────────────────────────────────────────────────
      - name: Cleanup
        if: always()
        run: |
          sudo killall openvpn || true
          rm -f deployment.env .github/vpn/spar.ovpn /tmp/stocktake.tar.gz