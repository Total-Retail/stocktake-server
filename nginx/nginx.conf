events {
    worker_connections 1024;
}

http {
    # Use Docker's internal DNS resolver.
    # Variables in proxy_pass force per-request resolution so nginx doesn't
    # crash at startup if an upstream container isn't ready yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # API health — exposed directly so deployment scripts and load
        # balancers can probe without going through the web frontend.
        location /health {
            set $upstream_api http://stocktake-api:8080;
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            set $upstream_api http://stocktake-api:8080;
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ws/ {
            set $upstream_api http://stocktake-api:8080;
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            set $upstream_web http://stocktake-web:3000;
            proxy_pass $upstream_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
